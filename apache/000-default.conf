<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Allow .htaccess overrides
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Ensure mod_rewrite is enabled (usually is in php:apache image)
    # If rewrite rules don't work, you might need a custom Dockerfile
    # based on php:8.2-apache that runs `a2enmod rewrite`

</VirtualHost>
